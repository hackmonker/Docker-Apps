  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: 
      - '--promscrape.config=/config/config.yml'
      - '--storageDataPath=/data'
      - '--retentionPeriod=45d'
    expose:
      - 8428
    volumes:
      - /opt/containers/victoriametrics:/config
      - /opt/containers/victoriametrics/data:/data
    depends_on:
      - cadvisor
      - node-exporter
      - process-exporter

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command: 
      - '--config.file=/config/config.yml'
      - '--storage.tsdb.path=/data'
      - '--storage.tsdb.retention.time=45d'
      - '--web.enable-lifecycle'
    expose:
      - 9090
    volumes:
      - /opt/containers/prometheus:/config
      - /opt/containers/prometheus/data:/data
    depends_on:
      - cadvisor
      - node-exporter
      - process-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=yourpassword
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_HOME=/usr/share/grafana
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/monitoring.json
    volumes:
      - /opt/containers/grafana/data:/var/lib/grafana
      - /opt/containers/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - victoriametrics

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg

  process-exporter:
    image: ncabatoff/process-exporter
    container_name: process-exporter
    restart: unless-stopped
    command: --procfs /host/proc -config.path /config/process-exporter.yml
    expose:
      - 9256
    volumes:
      - /proc:/host/proc
      - /opt/containers/process-exporter:/config
    privileged: true
