services:
  # CrowdSec - Open-source & Collaborative IPS
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - t3_proxy
    ports:
      - "$CROWDSEC_PORT:8080" # Local API port
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors crowdsecurity/iptables crowdsecurity/linux crowdsecurity/sshd"
      GID: ${PGID}
      CUSTOM_HOSTNAME: $HOSTNAME
    volumes:
      - $CONTAINERSDIR/crowdsec/logs:/logs/crowdsec:ro
      - $CONTAINERSDIR/traefik/logs:/logs/traefik:ro
      - /var/log:/var/log:ro
      - $CONTAINERSDIR/crowdsec/data:/var/lib/crowdsec/data
      - $CONTAINERSDIR/crowdsec/crowdsec/config:/etc/crowdsec