  jellyfin-vue:
    image: jellyfin/jellyfin-vue:unstable
    container_name: jellyfin-vue
    restart: unless-stopped
    expose:
      - 80
    environment:
      - DOMAIN=${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin-vue.rule=Host(`jellyfinv.${DOMAIN}`)
      - traefik.http.services.jellyfin-vue.loadbalancer.server.port=80
