  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    expose:
      - 7575
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - DOMAIN=${DOMAIN}
    volumes:
      - /opt/containers/homarr/data/configs:/app/data/configs
      - /opt/containers/homarr/public/icons:/app/public/icons
    labels:
      - traefik.enable=true
      - traefik.http.routers.homarr.rule=Host(`homarr.${DOMAIN}`)
      - traefik.http.services.homarr.loadbalancer.server.port=7575
