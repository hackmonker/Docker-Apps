  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    expose:
      - 8443
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=69vsc69
      - SUDO_PASSWORD=1234
      - DEFAULT_WORKSPACE=/opt/docker
      - DOMAIN=${DOMAIN}
    volumes:
      - /opt/docker:/opt/docker
      - /opt/containers:/opt/containers
      - /opt/containers/code-server:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.code-server.rule=Host(`vsc.${DOMAIN}`)
      - traefik.http.services.code-server.loadbalancer.server.port=8443
