  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - /opt/containers/npm/data:/data
      - /etc/letsencrypt:/etc/letsencrypt
